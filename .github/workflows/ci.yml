name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test policy checker
        shell: bash
        run: bash scripts/tests/check-workflow-policy_test.sh
      - name: Enforce repository workflow policy
        shell: bash
        run: bash scripts/check-workflow-policy.sh

  diagnostic-codeql:
    name: Diagnostic CodeQL SARIF contract
    needs:
      - workflow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      CODEQL_OVERLAY_DATABASE_MODE: none
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up diagnostic Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false
      - name: Prove exact Go toolchain
        shell: bash
        run: test "$(go version)" = 'go version go1.26.6 linux/amd64'
      - name: Initialize diagnostic CodeQL without upload permission
        id: diagnostic-init
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: manual
          tools: linked
          trap-caching: false
          dependency-caching: false
      - name: Prove exact diagnostic CodeQL CLI
        shell: bash
        run: test '${{ steps.diagnostic-init.outputs.codeql-version }}' = '2.26.3'
      - name: Preflight selected Go tool package boundary
        shell: bash
        run: bash scripts/check-go-dependency-boundary.sh --tools-only
      - name: Generate APIs and verify tracked outputs
        shell: bash
        run: |
          go generate ./...
          git diff --exit-code -- codegen/
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build for diagnostic CodeQL
        shell: bash
        run: go build ./...
      - name: Analyze locally without uploading SARIF or a database
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/diagnostic-codeql-sarif
      - name: Verify the trusted SARIF gate before execution
        shell: bash
        run: >-
          printf '%s  %s\n'
          'f68ba3d727eeb2879586ebbdf2914b93fe7a3f0c8aa8ac481ad29613c319f737'
          'scripts/check-codeql-sarif.py' | sha256sum --check --strict
      - name: Reject diagnostic High-or-higher SARIF results
        shell: bash
        run: python3 scripts/check-codeql-sarif.py "$RUNNER_TEMP/diagnostic-codeql-sarif"
      - name: Reprove clean checkout after diagnostic analysis
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  go:
    name: Go 1.26.6
    needs:
      - workflow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false
      - name: Install isolated Debian VM tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-image-utils qemu-system-x86 qemu-utils
      - name: Verify reviewed VM harness before executing pull request code
        shell: bash
        run: |
          printf '%s  %s\n' \
            '186a91e596aba93a23364d260e5b640b04409dae263840f2399c7be41cc4db46' 'scripts/tests/check-debian11-systemd-vm.sh' \
            '32c8a77d66ef4953355338c4fc532f9bf94e39f469b4ac5ef11d627f9a9e8519' 'scripts/tests/test-systemd-lifecycle.sh' |
            sha256sum --check --strict
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exercise local administrator lifecycle under systemd 247 PID 1
        shell: bash
        run: bash scripts/tests/check-debian11-systemd-vm.sh
      - name: Verify module graph
        shell: bash
        run: go mod tidy -diff
      - name: Preflight selected Go tool package boundary
        shell: bash
        run: bash scripts/check-go-dependency-boundary.sh --tools-only
      - name: Generate APIs and verify tracked outputs
        shell: bash
        run: |
          go generate ./...
          git diff --exit-code -- codegen/
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Enforce Linux test, release, and tool package boundaries
        shell: bash
        run: bash scripts/check-go-dependency-boundary.sh --all
      - name: Enforce dependency license policy
        shell: bash
        run: go tool go-licenses check --include_tests ./... tool
      - name: Race tests
        shell: bash
        run: go test -race -count=1 ./...
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Reachable vulnerability policy
        shell: bash
        run: |
          bash scripts/tests/check-govuln-policy_test.sh
          set -o pipefail
          go tool govulncheck -json ./... |
            go run ./scripts/govuln-policy.go security/govuln-allowlist.txt
