name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test policy checker
        run: bash scripts/tests/check-workflow-policy_test.sh
      - name: Enforce repository workflow policy
        run: bash scripts/check-workflow-policy.sh

  go:
    name: Go 1.26.6
    needs:
      - workflow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false
      - name: Verify module graph
        run: go mod tidy -diff
      - name: Preflight selected Go tool package boundary
        run: bash scripts/check-go-dependency-boundary.sh --tools-only
      - name: Generate APIs and verify tracked outputs
        run: |
          go generate ./...
          git diff --exit-code -- codegen/
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Enforce Linux test, release, and tool package boundaries
        run: bash scripts/check-go-dependency-boundary.sh --all
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Reachable vulnerability policy
        shell: bash
        run: |
          set -o pipefail
          go tool govulncheck -json ./... |
            go run ./scripts/govuln-policy.go security/govuln-allowlist.txt
